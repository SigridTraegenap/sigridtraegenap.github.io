project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!teaching.qmd"

website:
  title: "Sigrid Trägenap"
  site-url: https://sigridtraegenap.github.io
  description: "Computational neuroscientist working on cortical development."
  favicon: assets/favicon.png
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research Interests
      - href: publications.qmd
        text: Publications
      - href: cv.qmd
        text: CV
      - href: outreach.qmd
        text: Outreach
    right:
      - icon: github
        href: https://github.com/SigridTraegenap
        aria-label: GitHub
  page-footer:
    center: |
      This site is currently under construction.<br>
      © 2026 Sigrid Trägenap · [Impressum](impressum.qmd)

format:
